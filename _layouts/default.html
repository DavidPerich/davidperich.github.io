<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>{% if page.title %}{{ page.title }} - David Perich{% else %}David Perich{% endif %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" property="og:title" content="{% if page.title %}{{ page.title }} - David Perich{% else %}David Perich{% endif %}" />
    <meta name="description" property="og:description" content="David Perich - Staff Software Engineer" />
    <meta name="author" content="David Perich" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicons/favicon.ico" />
    <link rel="manifest" href="/public/favicons/site.webmanifest" />
    <link rel="mask-icon" href="/public/favicons/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#2b5797" />
    <meta name="theme-color" content="#ffffff" />
    
    <style>
      :root {
        --bg-color: #fcfcfc;
        --text-color: #1a1a1a;
        --link-color: #0066cc;
        --accent-color: #555555;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #e0e0e0;
          --link-color: #66b2ff;
          --accent-color: #aaaaaa;
        }
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        line-height: 1.6;
        margin: 0;
        padding: 2rem 1rem;
        display: flex;
        justify-content: center;
      }

      main {
        max-width: 650px;
        width: 100%;
      }

      header {
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.8rem;
        margin: 0 0 0.2rem 0;
        font-weight: bold;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--accent-color);
        margin: 0;
      }

      h2 {
        font-size: 1.1rem;
        margin: 2rem 0 1rem 0;
        font-weight: bold;
      }

      p {
        margin: 0 0 1.2rem 0;
      }

      ul {
        list-style-type: "- ";
        padding-left: 1.2rem;
        margin: 0 0 2rem 0;
      }

      li {
        margin-bottom: 0.5rem;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      footer {
        margin-top: 3rem;
        border-top: 1px dashed var(--accent-color);
        padding-top: 1.5rem;
      }
      
      .back-home {
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="back-home">
        <a href="/">← David Perich</a>
      </div>

      <header>
        <h1>{{ page.title }}</h1>
        {% if page.date %}
          <p class="subtitle">{{ page.date | date: "%B %d, %Y" }}</p>
        {% endif %}
      </header>

      {{ content }}

      <footer>
        <p>Email: <a href="mailto:hello@davidperich.com">hello@davidperich.com</a></p>
      </footer>
    </main>
  </body>
</html>
